<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<style>
text{font-family:sans-serif}
.big{font-size:21px;font-weight:bold;fill:#2C2417}
.mid{font-size:17px;font-weight:bold;fill:#2C2417}
.sm{font-size:14px;fill:#2C2417}
.blk{font-size:12.5px;font-weight:bold;fill:#2C2417;text-anchor:middle}
.r1{animation:rf 2.4s linear infinite}
.r2{animation:rf 3.1s linear infinite;animation-delay:-.9s}
.r3{animation:rf 2.7s linear infinite;animation-delay:-.4s}
.r4{animation:rf 3.6s linear infinite;animation-delay:-1.5s}
.r5{animation:rf 2.2s linear infinite;animation-delay:-2.1s}
.r6{animation:rf 3.0s linear infinite;animation-delay:-1.1s}
@keyframes rf{0%{transform:translateY(0);opacity:1}86%{transform:translateY(233px);opacity:0}100%{transform:translateY(0);opacity:0}}
</style>
<defs>
<g id="cat">
<path d="M-16 14 q-20 -2 -18 -20" fill="none" stroke="#2C2417" stroke-width="3.5" stroke-linecap="round"/>
<ellipse cx="-7" cy="30" rx="8" ry="5.5" fill="currentColor" stroke="#2C2417" stroke-width="3"/>
<ellipse cx="11" cy="30" rx="8" ry="5.5" fill="currentColor" stroke="#2C2417" stroke-width="3"/>
<ellipse cx="0" cy="12" rx="23" ry="18" fill="currentColor" stroke="#2C2417" stroke-width="3.5"/>
<circle cx="3" cy="-13" r="17" fill="currentColor" stroke="#2C2417" stroke-width="3.5"/>
<polygon points="-8,-25 -12,-39 1,-31" fill="currentColor" stroke="#2C2417" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="9,-29 19,-39 21,-23" fill="currentColor" stroke="#2C2417" stroke-width="3.5" stroke-linejoin="round"/>
<circle cx="1" cy="-15" r="2.8" fill="#2C2417"/>
<circle cx="12" cy="-15" r="2.8" fill="#2C2417"/>
<polygon points="5,-8 11,-8 8,-4" fill="#FF8FA3" stroke="#2C2417" stroke-width="2" stroke-linejoin="round"/>
<path d="M2 -2 q6 5 12 1" fill="none" stroke="#2C2417" stroke-width="2.5" stroke-linecap="round"/>
</g>
<path id="hat210" d="M12 0 H198 Q210 0 210 12 V30 Q210 42 198 42 H122 V33 H88 V42 H12 Q0 42 0 30 V12 Q0 0 12 0 Z"/>
<path id="cmd210" d="M12 0 H88 V-9 H122 V0 H198 Q210 0 210 12 V30 Q210 42 198 42 H122 V33 H88 V42 H12 Q0 42 0 30 V12 Q0 0 12 0 Z"/>
</defs>
<rect width="640" height="360" fill="#F4EDE0"/>
<text class="big" x="24" y="32">第3关 · 克隆体下雨</text>
<text class="sm" x="24" y="54">每个克隆体自带坐标和速度，各落各的，快慢不一才像下雨</text>
<rect x="24" y="74" width="352" height="230" rx="10" fill="#FFFFFF" stroke="#2C2417" stroke-width="4"/>
<text class="sm" x="44" y="100">克隆体随机出现</text>
<rect x="26" y="250" width="348" height="52" rx="6" fill="#8AC926" stroke="#2C2417" stroke-width="3"/>
<text class="mid" x="200" y="280" text-anchor="middle">地面：落到底 → 删除此克隆体</text>
<g transform="translate(60,102) scale(0.55)"><g class="r1"><use href="#cat" color="#FFD166"/></g></g>
<g transform="translate(120,102) scale(0.55)"><g class="r2"><use href="#cat" color="#FF8FA3"/></g></g>
<g transform="translate(180,102) scale(0.55)"><g class="r3"><use href="#cat" color="#FFD166"/></g></g>
<g transform="translate(240,102) scale(0.55)"><g class="r4"><use href="#cat" color="#4CC9F0"/></g></g>
<g transform="translate(300,102) scale(0.55)"><g class="r5"><use href="#cat" color="#FFD166"/></g></g>
<g transform="translate(352,102) scale(0.55)"><g class="r6"><use href="#cat" color="#8AC926"/></g></g>
<use href="#hat210" x="392" y="86" fill="#FFD166"/>
<text class="blk" x="497" y="113">当作为克隆体启动时</text>
<use href="#cmd210" x="392" y="128" fill="#8AC926"/>
<text class="blk" x="497" y="155">下落速度 = 随机数 2~8</text>
<path d="M404 180 H592 Q602 180 602 190 V250 Q602 260 592 260 H404 Q394 260 394 250 V190 Q394 180 404 180 Z" fill="#FF8FA3" stroke="#2C2417" stroke-width="3.5"/>
<rect x="412" y="202" width="168" height="48" fill="#F4EDE0"/>
<text class="blk" x="497" y="197">重复执行</text>
<path d="M420 208 Q420 204 424 204 H566 Q570 204 570 208 V234 Q570 238 566 238 H424 Q420 238 420 234 Z" fill="#4CC9F0" stroke="#2C2417" stroke-width="3.5"/>
<text class="blk" x="494" y="230">将 y 坐标增加 -下落速度</text>
<use href="#cmd210" x="392" y="264" fill="#FF8FA3"/>
<text class="blk" x="497" y="291">触底 → 删除此克隆体</text>
<text class="mid" x="24" y="344">每个克隆体各带一个随机下落速度，各落各的，触底就删除</text>
</svg>
